# تشغيل كامل للإنتاج: قاعدة البيانات + التطبيق.
#   cp .env.example .env   (ثم عدّل القيم)
#   docker compose up -d --build
#   docker compose exec app npm run setup     (أول مرة فقط: الجداول + البيانات الأولى)
services:
  db:
    image: postgres:16-alpine
    container_name: anas-dental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: anas_dental
      TZ: Asia/Damascus
    # قاعدة البيانات غير مكشوفة للإنترنت — متاحة فقط من هذا الجهاز
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dental -d anas_dental']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: anas-dental-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dental:${POSTGRES_PASSWORD}@db:5432/anas_dental?schema=public
      NODE_ENV: production
      TZ: Asia/Damascus
    # يُعرض على المنفذ المحلي فقط؛ nginx أمامه يتولى HTTPS
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - dental_uploads:/app/storage/uploads

volumes:
  dental_pgdata:
  dental_uploads:
